<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maple link previews: pick a design</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { background: #f2f2f2; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: 48px 32px 140px; }
.page { max-width: 1240px; margin: 0 auto; }
header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
header p { margin-top: 8px; font-size: 15px; line-height: 1.5; color: #666; max-width: 60ch; text-wrap: pretty; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 28px 0 48px; }
.legend div { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.legend b { font-size: 15px; font-weight: 600; }
.legend p { margin-top: 6px; font-size: 13px; line-height: 1.5; color: #666; text-wrap: pretty; }
.legend small { display: block; margin-top: 10px; font-size: 12px; line-height: 1.5; color: #999; }
section.route { margin-bottom: 56px; }
.route h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.route h2 code { font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #888; }
.route .when { margin-top: 4px; font-size: 13px; color: #888; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
@media (max-width: 560px) { .options { grid-template-columns: 1fr; } }
.opt { position: relative; display: block; cursor: pointer; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .frame { border-radius: 10px; transition: box-shadow 150ms ease-out; }
.opt:hover .frame { box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 0 0 4px rgba(0,0,0,.08); }
.opt input:focus-visible + .frame { box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 0 0 4px #4f8ff7; }
.opt input:checked + .frame { box-shadow: 0 0 0 2px #1a1a1a, 0 0 0 6px rgba(26,26,26,.12); }
.opt .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: #555; }
.opt .radio { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #bbb; flex: none; }
.opt input:checked ~ .foot .radio { box-shadow: inset 0 0 0 5px #1a1a1a; }
.opt input:checked ~ .foot { color: #1a1a1a; font-weight: 500; }
.bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 999px; background: rgba(18,18,18,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 10; }
.bar .count { color: rgba(255,255,255,.65); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar input { width: 140px; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: 16px; }
.bar input::placeholder { color: rgba(255,255,255,.45); }
.bar button { height: 32px; padding: 0 14px; border-radius: 999px; border: 0; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
.bar button:active { transform: scale(0.97); }
.bar .primary { background: #fff; color: #111; }
.bar .ghost { background: transparent; color: rgba(255,255,255,.65); }
.bar .ghost:hover { color: #fff; }

/* ---------- OG canvas: 1200 × 630, every length in canvas pixels via --u ---------- */
.frame { container-type: inline-size; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
.og { --u: calc(100cqw / 1200); position: relative; width: 100%; aspect-ratio: 1200 / 630; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #252525; background: #f8f8f8; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.logo { width: calc(44 * var(--u)); height: calc(44 * var(--u)); display: block; mix-blend-mode: multiply; }
.brand { display: flex; align-items: center; gap: calc(12 * var(--u)); font-size: calc(26 * var(--u)); font-weight: 600; letter-spacing: -0.02em; }
.sky { color: oklch(50% 0.134 242.749); }

/* 1. Bloom */
.bloom .copy { position: absolute; left: calc(72 * var(--u)); top: calc(72 * var(--u)); bottom: calc(72 * var(--u)); width: calc(540 * var(--u)); display: flex; flex-direction: column; }
.bloom .eyebrow { margin-top: auto; font-size: calc(18 * var(--u)); color: #8a8a8a; }
.bloom h3 { margin-top: calc(18 * var(--u)); font-size: calc(62 * var(--u)); line-height: 1.04; font-weight: 600; letter-spacing: -0.035em; text-wrap: balance; }
.bloom p { margin-top: calc(22 * var(--u)); font-size: calc(25 * var(--u)); line-height: 1.35; color: #6f6f6f; text-wrap: pretty; max-width: 22ch; }
.bloom .window { position: absolute; right: calc(40 * var(--u)); top: calc(40 * var(--u)); bottom: calc(40 * var(--u)); width: calc(500 * var(--u)); border-radius: calc(28 * var(--u)); overflow: hidden; }
.bloom .window > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bloom .chip { position: absolute; left: calc(28 * var(--u)); right: calc(28 * var(--u)); bottom: calc(28 * var(--u)); display: flex; align-items: center; gap: calc(14 * var(--u)); padding: calc(18 * var(--u)) calc(22 * var(--u)); border-radius: calc(18 * var(--u)); background: rgba(255,255,255,.72); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 0 0 calc(1 * var(--u)) rgba(255,255,255,.6) inset, 0 calc(10 * var(--u)) calc(30 * var(--u)) rgba(30,60,90,.12); font-size: calc(21 * var(--u)); }
.bloom .chip small { display: block; font-size: calc(16 * var(--u)); color: #777; margin-top: calc(3 * var(--u)); }
.bloom .dot { width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: 50%; flex: none; }

/* 2. Specimen */
.spec .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(0,0,0,.055) calc(1 * var(--u)), transparent calc(1 * var(--u))); background-size: calc(100% / 12) 100%; }
.spec .top { position: absolute; left: calc(64 * var(--u)); right: calc(64 * var(--u)); top: calc(56 * var(--u)); display: flex; align-items: center; justify-content: space-between; }
.spec .meta { font-size: calc(17 * var(--u)); color: #8a8a8a; display: flex; gap: calc(28 * var(--u)); }
.spec .line { position: absolute; left: calc(64 * var(--u)); top: calc(178 * var(--u)); width: calc(620 * var(--u)); font-size: calc(30 * var(--u)); line-height: 1.3; color: #666; text-wrap: pretty; }
.spec .line em { font-style: normal; color: #252525; }
.spec .word { position: absolute; left: calc(48 * var(--u)); bottom: calc(-62 * var(--u)); font-size: calc(300 * var(--u)); line-height: 1; font-weight: 650; letter-spacing: -0.06em; white-space: nowrap; color: #1c1c1c; }
.spec .mark { position: absolute; right: calc(64 * var(--u)); top: calc(178 * var(--u)); text-align: right; }
.spec .tag { display: inline-block; font-size: calc(18 * var(--u)); padding: calc(8 * var(--u)) calc(14 * var(--u)); border-radius: 999px; }
.spec .tag.sky { background: oklch(68.5% 0.169 237.323 / .15); }
.spec .glyphs { display: flex; gap: calc(10 * var(--u)); justify-content: flex-end; }
.spec .glyphs i { width: calc(40 * var(--u)); height: calc(48 * var(--u)); border-radius: calc(8 * var(--u)); display: block; }
.orbs { display: flex; justify-content: flex-end; }
.orb { width: calc(40 * var(--u)); height: calc(40 * var(--u)); border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 42%), var(--c); box-shadow: 0 0 0 calc(3 * var(--u)) #f8f8f8; }
.orb + .orb { margin-left: calc(-10 * var(--u)); }

/* 3. Maze */
.maze .field { position: absolute; top: 0; bottom: 0; right: 0; width: calc(600 * var(--u)); overflow: hidden; }
.maze .field img { position: absolute; width: calc(1500 * var(--u)); height: calc(1500 * var(--u)); mix-blend-mode: multiply; }
.maze .copy { position: absolute; left: calc(72 * var(--u)); top: calc(72 * var(--u)); bottom: calc(72 * var(--u)); width: calc(470 * var(--u)); display: flex; flex-direction: column; }
.maze .brandword { font-size: calc(26 * var(--u)); font-weight: 600; letter-spacing: -0.02em; }
.maze .path { margin-top: auto; font-size: calc(18 * var(--u)); color: #8a8a8a; display: flex; align-items: center; gap: calc(10 * var(--u)); }
.maze .path i { width: calc(10 * var(--u)); height: calc(10 * var(--u)); border-radius: 50%; display: block; }
.maze h3 { margin-top: calc(16 * var(--u)); font-size: calc(64 * var(--u)); line-height: 1.02; font-weight: 600; letter-spacing: -0.04em; text-wrap: balance; }
.maze p { margin-top: calc(20 * var(--u)); font-size: calc(24 * var(--u)); line-height: 1.38; color: #6f6f6f; text-wrap: pretty; }

/* 4. Cover */
.cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .veil { position: absolute; inset: 0; background: linear-gradient(to top, rgba(248,248,248,.55), rgba(248,248,248,0) 55%); }
.cover .top { position: absolute; left: calc(56 * var(--u)); right: calc(56 * var(--u)); top: calc(48 * var(--u)); display: flex; align-items: center; justify-content: space-between; }
.cover .top .meta { font-size: calc(17 * var(--u)); color: rgba(20,20,20,.6); letter-spacing: .04em; }
.cover h3 { position: absolute; left: calc(52 * var(--u)); right: calc(56 * var(--u)); bottom: calc(118 * var(--u)); font-size: calc(132 * var(--u)); line-height: .92; font-weight: 650; letter-spacing: -0.055em; color: #111; text-wrap: balance; }
.cover p { position: absolute; left: calc(56 * var(--u)); bottom: calc(56 * var(--u)); font-size: calc(25 * var(--u)); color: rgba(20,20,20,.72); }
</style>

<div class="page">
  <header>
    <h1>Maple link previews</h1>
    <p>When someone pastes a Maple link into Slack, email, or anywhere else, this image shows up under it. Pick one design for each page, then copy your picks and post them in the thread.</p>
  </header>
  <div class="legend" id="legend"></div>
  <div id="routes"></div>
</div>

<div class="bar" role="region" aria-label="Your picks">
  <span class="count" id="count">0 of 8 picked</span>
  <input id="name" placeholder="Your name" autocomplete="name" aria-label="Your name">
  <button class="ghost" id="reset" type="button">Clear</button>
  <button class="primary" id="copy" type="button">Copy picks</button>
</div>

<script>
const LOGO = document.getElementById("LOGO").src, A = document.getElementById("BA").src, B = document.getElementById("BB").src;

const ROUTES = [
  { key: "home", label: "Default", path: "/, /chats, /chats/new, /onboarding", when: "Any Maple link with nothing more specific", title: "Multiplayer AI for your whole company", cover: "Multiplayer AI", sub: "Your own workspace, and the same agent in every channel.", word: "maple", orb: "#1a73f2" },
  { key: "invite", label: "Invite", path: "/invite/$token", when: "The most-shared link: an admin pastes it in Slack or email", title: "Join Northwind on Maple", cover: "Join Northwind", sub: "You've been invited to join as a member.", word: "join", orb: "#4f46e5" },
  { key: "chat", label: "Chat", path: "/chats/$sessionId", when: "A teammate shares a chat. Never shows its title or content", title: "A conversation with @maple", cover: "Shared chat", sub: "Sign in to read it with your team.", word: "chat", orb: "#0891b2" },
  { key: "project", label: "Project", path: "/projects/$projectId", when: "A project link dropped in a channel", title: "A project on Maple", cover: "A project", sub: "Chats, files, and the agent, shared by everyone in it.", word: "project", orb: "#db2777" },
  { key: "meetings", label: "Meetings", path: "/meetings, /meetings/$meetingId", when: "Notes shared after a call", title: "Meeting notes", cover: "Meeting notes", sub: "What was said, what was decided, and who does what next.", word: "meetings", orb: "#0d9488" },
  { key: "kb", label: "Knowledge base", path: "/knowledge-base", when: "Pointing someone at the company's documents", title: "Knowledge base", cover: "Knowledge base", sub: "Documents your agent can search and use.", word: "knowledge", orb: "#16a34a" },
  { key: "memory", label: "Memory", path: "/memory", when: "Showing what the agent knows about how you work", title: "Memory", cover: "Memory", sub: "What the agent carries between conversations.", word: "memory", orb: "#7c3aed" },
  { key: "scheduled", label: "Scheduled", path: "/scheduled, /scheduled/$cronId", when: "Sharing a recurring task with the team", title: "Scheduled", cover: "Scheduled", sub: "Recurring work the agent runs for you, on its own.", word: "scheduled", orb: "#d97706" },
];
const brand = () => `<div class="brand"><img class="logo" src="${LOGO}" alt="">Maple</div>`;
const mention = (s) => s.replace("@maple", "<span class='sky'>@maple</span>");

const BLOOM = {
  home: [A, "30% 40%", "#1a73f2", "@maple joined #launch", "Ready for the whole channel"],
  invite: [B, "70% 30%", "#4f46e5", "Northwind", "12 people · you're next"],
  chat: [A, "75% 65%", "#0891b2", "@maple is replying", "Shared with 3 people"],
  project: [A, "10% 90%", "#db2777", "Q4 launch plan", "6 people · 14 chats"],
  meetings: [B, "20% 80%", "#0d9488", "Weekly product sync", "32 min · 4 follow-ups"],
  kb: [B, "95% 10%", "oklch(69.6% 0.17 162.48)", "Pricing 2027.xlsx", "Indexed · searchable by the agent"],
  memory: [A, "55% 15%", "#7c3aed", "Remembered", "Keeps rollout notes under 200 words"],
  scheduled: [B, "45% 55%", "oklch(76.9% 0.188 70.08)", "Every Monday at 9:00", "Next run in 2 days"],
};
function bloom(r) {
  const [img, pos, c, a, b] = BLOOM[r.key];
  return `<div class="og bloom"><div class="copy">${brand()}
    <div class="eyebrow mono">maple / ${r.key === "home" ? "workspace" : r.label.toLowerCase()}</div>
    <h3>${mention(r.title)}</h3><p>${r.sub}</p></div>
    <div class="window"><img src="${img}" style="object-position:${pos}" alt=""><div class="chip"><span class="dot" style="background:${c}"></span><div>${a}<small>${b}</small></div></div></div></div>`;
}

const SPEC_MARK = {
  home: `<span class="tag sky">@maple</span>`,
  invite: `<span class="tag sky">as a member</span>`,
  chat: `<span class="tag sky">@maple</span>`,
  project: `<div class="orbs">${["#db2777", "#ea580c", "#4f46e5", "#0d9488"].map((c) => `<span class="orb" style="--c:${c}"></span>`).join("")}</div>`,
  meetings: `<span class="mono" style="font-size:calc(22*var(--u));color:#8a8a8a">00:32:14</span>`,
  kb: `<div class="glyphs"><i style="background:oklch(63.7% 0.237 25.331 / .18)"></i><i style="background:oklch(69.6% 0.17 162.48 / .2)"></i><i style="background:oklch(62.3% 0.214 259.815 / .18)"></i><i style="background:oklch(70.5% 0.213 47.604 / .2)"></i></div>`,
  memory: `<span class="tag" style="background:#ececec;color:#555">remembered</span>`,
  scheduled: `<span class="mono" style="font-size:calc(24*var(--u))">0 9 * * 1</span>`,
};
function specimen(r, i) {
  return `<div class="og spec"><div class="grid"></div>
    <div class="top">${brand()}<div class="meta mono"><span>${r.path.split(",")[0]}</span><span>${String(i + 1).padStart(2, "0")} / 08</span></div></div>
    <div class="line"><em>${r.title}.</em> ${r.sub}</div><div class="mark">${SPEC_MARK[r.key]}</div><div class="word">${r.word}</div></div>`;
}

const MAZE = {
  home: [-260, -380, 0], invite: [-620, -260, 90], chat: [-420, -720, 180], project: [-300, -500, 270],
  meetings: [-700, -560, 0], kb: [-380, -300, 180], memory: [-560, -640, 90], scheduled: [-480, -420, 270],
};
function maze(r) {
  const [x, y, rot] = MAZE[r.key];
  return `<div class="og maze">
    <div class="field"><img src="${LOGO}" alt="" style="left:calc(${x}*var(--u));top:calc(${y}*var(--u));transform:rotate(${rot}deg)"></div>
    <div class="copy"><div class="brandword">Maple</div>
      <div class="path mono"><i style="background:${r.orb}"></i>${r.path.split(",")[0]}</div>
      <h3>${mention(r.title)}</h3><p>${r.sub}</p></div></div>`;
}

const COVER = {
  home: [A, "40% 45%", 1, 0], invite: [B, "60% 40%", 1, 0], chat: [A, "70% 70%", -1, -12], project: [A, "15% 85%", 1, 18],
  meetings: [B, "25% 75%", -1, -10], kb: [B, "90% 20%", 1, 8], memory: [A, "50% 20%", -1, 22], scheduled: [B, "50% 55%", -1, -6],
};
function cover(r) {
  const [img, pos, flip, hue] = COVER[r.key];
  return `<div class="og cover"><img src="${img}" alt="" style="object-position:${pos};transform:scaleX(${flip});filter:hue-rotate(${hue}deg) saturate(1.08)">
    <div class="veil"></div>
    <div class="top">${brand()}<span class="meta mono">${r.path.split(",")[0]}</span></div>
    <h3>${r.cover}</h3><p>${r.sub}</p></div>`;
}

const DIRECTIONS = [
  { key: "bloom", name: "Bloom", render: bloom, about: "Maple's floral photo in a rounded window, with one glass chip naming the thing being shared.", refs: "Stripe Press covers, The Browser Company launch cards" },
  { key: "specimen", name: "Specimen", render: specimen, about: "The page's own word set huge and cut off at the bottom edge, on a visible 12-column grid.", refs: "Müller-Brockmann grid posters, Vercel and Linear type-only cards" },
  { key: "maze", name: "Maze", render: maze, about: "A giant crop of the Maple mark. Every page shows a different stretch of the same winding path.", refs: "Pentagram identity systems, Teenage Engineering packaging" },
  { key: "cover", name: "Cover", render: cover, about: "Full-bleed photo, a magazine-sized title, and nothing else. The photo is flipped and tinted per page.", refs: "Kinfolk and Apartamento covers, Apple event invites" },
];

document.getElementById("legend").innerHTML = DIRECTIONS.map((d) => `<div><b>${d.name}</b><p>${d.about}</p><small>Inspired by ${d.refs}</small></div>`).join("");
document.getElementById("routes").innerHTML = ROUTES.map((r, i) => `
  <section class="route"><h2>${r.label}<code>${r.path}</code></h2><div class="when">${r.when}</div>
    <div class="options">${DIRECTIONS.map((d) => `
      <label class="opt"><input type="radio" name="${r.key}" value="${d.key}"><div class="frame">${d.render(r, i)}</div>
        <div class="foot"><span class="radio"></span>${d.name}</div></label>`).join("")}</div></section>`).join("");

const STORE = "maple-og-picks";
const nameInput = document.getElementById("name");
function picks() { return Object.fromEntries(ROUTES.map((r) => [r.key, document.querySelector(`input[name="${r.key}"]:checked`)?.value]).filter(([, v]) => v)); }
function sync() {
  const p = picks(), n = Object.keys(p).length;
  document.getElementById("count").textContent = `${n} of ${ROUTES.length} picked`;
  localStorage.setItem(STORE, JSON.stringify({ picks: p, name: nameInput.value }));
}
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
  Object.entries(saved.picks || {}).forEach(([k, v]) => { const el = document.querySelector(`input[name="${k}"][value="${v}"]`); if (el) el.checked = true; });
  nameInput.value = saved.name || "";
} catch {}
sync();
document.addEventListener("change", sync);
nameInput.addEventListener("input", sync);
document.getElementById("reset").addEventListener("click", () => { document.querySelectorAll(".opt input").forEach((el) => (el.checked = false)); sync(); });

const copyBtn = document.getElementById("copy");
copyBtn.addEventListener("click", async () => {
  const p = picks(), label = (k) => DIRECTIONS.find((d) => d.key === k)?.name || "No pick";
  const text = [`Maple link preview picks${nameInput.value ? ` from ${nameInput.value}` : ""}`, ...ROUTES.map((r) => `${r.label}: ${label(p[r.key])}`)].join("\n");
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  copyBtn.textContent = "Copied";
  setTimeout(() => (copyBtn.textContent = "Copy picks"), 1600);
});
</script>
</body>
</html>
